<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="120" viewBox="0 0 1200 120"
     role="img" aria-labelledby="title">
  <title id="title">Tech Stack and Skills</title>

  <rect width="1200" height="120" fill="#0D1117"/>

  <!-- Left accent bar -->
  <rect x="56" y="36" width="4" height="48" rx="2" fill="#8B949E"/>

  <!-- Section title -->
  <text x="76" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="32" font-weight="600" fill="#E6EDF3">
    技能
  </text>

  <!-- Subtitle / mono metadata -->
  <text x="76" y="94" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
        font-size="14" fill="#8B949E">
    stack // languages · frameworks · tools
  </text>

  <!-- Right motif: connected module blocks -->
  <g transform="translate(1020, 40)" opacity="0.5">
    <rect x="0" y="0" width="24" height="24" rx="4" fill="none" stroke="#A90533" stroke-width="1.5"/>
    <rect x="36" y="8" width="24" height="24" rx="4" fill="none" stroke="#3FB950" stroke-width="1.5"/>
    <rect x="72" y="2" width="24" height="24" rx="4" fill="none" stroke="#8B949E" stroke-width="1.5"/>
    <line x1="24" y1="12" x2="36" y2="20" stroke="#8B949E" stroke-width="1"/>
    <line x1="60" y1="20" x2="72" y2="14" stroke="#8B949E" stroke-width="1"/>
  </g>

  <!-- Bottom border line -->
  <line x1="56" y1="112" x2="1144" y2="112" stroke="#21262D" stroke-width="1"/>
</svg>
