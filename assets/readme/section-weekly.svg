<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="120" viewBox="0 0 1200 120"
     role="img" aria-labelledby="title">
  <title id="title">Weekly Coding Activity</title>

  <rect width="1200" height="120" fill="#0D1117"/>

  <!-- Left accent bar -->
  <rect x="56" y="36" width="4" height="48" rx="2" fill="#3FB950"/>

  <!-- Section title -->
  <text x="76" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="32" font-weight="600" fill="#E6EDF3">
    本周编程
  </text>

  <!-- Subtitle / mono metadata -->
  <text x="76" y="94" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
        font-size="14" fill="#8B949E">
    wakatime // weekly report
  </text>

  <!-- Right motif: small activity bars -->
  <g transform="translate(1020, 38)" opacity="0.5">
    <rect x="0" y="28" width="8" height="16" rx="2" fill="#3FB950"/>
    <rect x="14" y="20" width="8" height="24" rx="2" fill="#3FB950"/>
    <rect x="28" y="8" width="8" height="36" rx="2" fill="#3FB950"/>
    <rect x="42" y="0" width="8" height="44" rx="2" fill="#A90533"/>
    <rect x="56" y="14" width="8" height="30" rx="2" fill="#3FB950"/>
    <rect x="70" y="24" width="8" height="20" rx="2" fill="#3FB950"/>
    <rect x="84" y="32" width="8" height="12" rx="2" fill="#8B949E"/>
  </g>

  <!-- Bottom border line -->
  <line x1="56" y1="112" x2="1144" y2="112" stroke="#21262D" stroke-width="1"/>
</svg>
