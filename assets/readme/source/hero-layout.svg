<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="400" viewBox="0 0 1200 400"
     role="img" aria-labelledby="title desc">
  <title id="title">ACodingDay - Systems Programmer</title>
  <desc id="desc">Dark terminal-style hero banner for ACodingDay's GitHub profile, featuring Erlang code and concurrent process motifs.</desc>

  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D1117"/>
      <stop offset="100%" stop-color="#161B22"/>
    </linearGradient>
    <clipPath id="terminal-clip">
      <rect x="56" y="218" width="520" height="148" rx="8"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bg-grad)"/>

  <!-- Subtle grid motif -->
  <g stroke="#21262D" stroke-width="0.5" opacity="0.6">
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="320" x2="1200" y2="320"/>
    <line x1="200" y1="0" x2="200" y2="400"/>
    <line x1="400" y1="0" x2="400" y2="400"/>
    <line x1="600" y1="0" x2="600" y2="400"/>
    <line x1="800" y1="0" x2="800" y2="400"/>
    <line x1="1000" y1="0" x2="1000" y2="400"/>
  </g>

  <!-- Actor process nodes motif (top-right area, subtle) -->
  <g id="actor-nodes" opacity="0.35">
    <circle cx="720" cy="52" r="5" fill="none" stroke="#A90533" stroke-width="1.5"/>
    <circle cx="780" cy="38" r="4" fill="none" stroke="#3FB950" stroke-width="1.5"/>
    <circle cx="760" cy="72" r="3.5" fill="none" stroke="#8B949E" stroke-width="1.5"/>
    <line x1="724" y1="49" x2="776" y2="40" stroke="#A90533" stroke-width="0.8" opacity="0.6"/>
    <line x1="722" y1="56" x2="757" y2="69" stroke="#8B949E" stroke-width="0.8" opacity="0.6"/>
    <line x1="778" y1="42" x2="762" y2="68" stroke="#3FB950" stroke-width="0.8" opacity="0.6"/>

    <circle cx="1100" cy="340" r="5" fill="none" stroke="#A90533" stroke-width="1.5"/>
    <circle cx="1150" cy="360" r="4" fill="none" stroke="#3FB950" stroke-width="1.5"/>
    <circle cx="1130" cy="320" r="3.5" fill="none" stroke="#8B949E" stroke-width="1.5"/>
    <line x1="1104" y1="343" x2="1146" y2="357" stroke="#A90533" stroke-width="0.8" opacity="0.6"/>
    <line x1="1103" y1="336" x2="1127" y2="323" stroke="#8B949E" stroke-width="0.8" opacity="0.6"/>
    <line x1="1148" y1="356" x2="1132" y2="324" stroke="#3FB950" stroke-width="0.8" opacity="0.6"/>
  </g>

  <!-- Title block -->
  <g id="title-block" transform="translate(56, 48)">
    <!-- Category label -->
    <text x="0" y="0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="18" fill="#3FB950" letter-spacing="1">
      // SYSTEMS PROGRAMMER
    </text>

    <!-- Name -->
    <text x="0" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="56" font-weight="700" fill="#E6EDF3">
      ACodingDay
    </text>

    <!-- Tagline -->
    <text x="0" y="104" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="22" fill="#8B949E">
      Erlang/OTP · Rust · Concurrent Systems
    </text>

    <!-- Terminal prompt motif -->
    <text x="0" y="142" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="18" fill="#A90533">
      &gt;
      <tspan fill="#8B949E"> building fault-tolerant systems</tspan>
    </text>
  </g>

  <!-- Terminal window with Erlang code -->
  <g id="terminal-window">
    <!-- Window frame -->
    <rect x="56" y="218" width="520" height="148" rx="8" fill="#161B22" stroke="#30363D" stroke-width="1"/>
    <!-- Title bar -->
    <rect x="56" y="218" width="520" height="28" rx="8" fill="#21262D"/>
    <rect x="56" y="238" width="520" height="8" fill="#21262D"/>
    <!-- Window dots -->
    <circle cx="76" cy="232" r="5" fill="#F85149"/>
    <circle cx="94" cy="232" r="5" fill="#D29922"/>
    <circle cx="112" cy="232" r="5" fill="#3FB950"/>
    <!-- Title bar text -->
    <text x="310" y="237" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="12" fill="#8B949E" text-anchor="middle">
      erl — shell
    </text>

    <!-- Code content -->
    <g clip-path="url(#terminal-clip)">
      <text x="72" y="270" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">
        <tspan fill="#A90533">-module</tspan><tspan fill="#E6EDF3">(coding_day).</tspan>
      </text>
      <text x="72" y="292" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">
        <tspan fill="#A90533">-export</tspan><tspan fill="#E6EDF3">([start/0]).</tspan>
      </text>
      <text x="72" y="320" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">
        <tspan fill="#3FB950">start</tspan><tspan fill="#E6EDF3">() -&gt;</tspan>
      </text>
      <text x="72" y="342" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">
        <tspan fill="#E6EDF3">    spawn_link(</tspan><tspan fill="#3FB950">fun</tspan><tspan fill="#E6EDF3"> loop/0).</tspan>
      </text>
    </g>
  </g>

  <!-- Reserved subject area (right side) -->
  <g id="subject-area">
    <!-- Placeholder: generated character will be composited here -->
    <rect x="640" y="60" width="500" height="320" rx="12" fill="none" stroke="#30363D" stroke-width="1" stroke-dasharray="6 4" opacity="0.4"/>
    <text x="890" y="225" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="14" fill="#30363D" text-anchor="middle">
      [ generated subject ]
    </text>
  </g>
</svg>
