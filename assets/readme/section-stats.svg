<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="120" viewBox="0 0 1200 120"
     role="img" aria-labelledby="title">
  <title id="title">Activity and Statistics</title>

  <rect width="1200" height="120" fill="#0D1117"/>

  <!-- Left accent bar -->
  <rect x="56" y="36" width="4" height="48" rx="2" fill="#A90533"/>

  <!-- Section title -->
  <text x="76" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="32" font-weight="600" fill="#E6EDF3">
    信息统计
  </text>

  <!-- Subtitle / mono metadata -->
  <text x="76" y="94" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
        font-size="14" fill="#8B949E">
    github // activity graph &amp; streak
  </text>

  <!-- Right motif: pulse/activity line -->
  <g transform="translate(1000, 60)" opacity="0.5">
    <polyline points="0,0 15,0 22,-18 30,14 38,-8 45,0 60,0 75,0 82,-22 90,10 98,0 120,0"
              fill="none" stroke="#A90533" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Bottom border line -->
  <line x1="56" y1="112" x2="1144" y2="112" stroke="#21262D" stroke-width="1"/>
</svg>
